name: oronbox
description: "A pretty fast wearable management tool for VelaOS and ZeppOS, built with Flutter."
publish_to: 'none'

version: 1.1.3+15

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  go_router: ^18.0.0
  flutter_riverpod: ^3.4.2
  url_launcher: ^6.3.2
  cached_network_image: ^4.0.2
  dynamic_color: ^2.1.0
  material_ui: ^1.4.0
  dio: ^5.11.1
  csv: ^8.0.0
  html: ^0.15.7

  cupertino_icons: ^1.0.9
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  segmented_list:
    path: packages/segmented_list
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  universal_ble: ^2.3.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  pointycastle: ^4.0.0
  crypto: ^3.0.7
  file_picker: ^13.1.0
  # desktop_drop 0.8.x is still coupled to cross_file 0.3.x
  cross_file: ^0.3.5+5
  archive: ^4.3.0
  image: ^4.10.1
  charset: ^2.0.1
  enough_convert: ^1.6.0
  logging: ^1.3.0
  qr_flutter: ^4.1.0
  app_links: ^7.2.1
  path_provider: ^2.1.6
  desktop_drop: ^0.8.4
  window_manager: ^0.5.2
  tray_manager: ^0.7.0
  flutter_soloud: ^4.1.7
  quickjs_engine: ^0.1.5
  oronbox_network:
    git:
      url: https://github.com/zxor-org/OronBox-Package-Network.git
      ref: v0.1.3
  web: ^1.1.1
  flutter_markdown_plus: ^1.0.12
  uuid: ^4.6.0
  mdns_dart: ^2.2.2
  fl_chart: ^1.2.0
  flutter_timezone: ^5.1.0
  cupertino_ui: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/team/
    - assets/images/devices/
    - assets/scripts/zeppos/zml.js
    - assets/images/brands/
    - assets/licenses/
    - assets/wasm/
    - assets/legal/
