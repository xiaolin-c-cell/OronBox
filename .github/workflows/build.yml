name: Build OronBox iOS BLE
on:
  workflow_dispatch:
  push:
    branches:
      - ios-ble-full-v130
permissions:
  contents: write
env:
  FLUTTER_VERSION: 3.50.1
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Pub get
        run: |
          rm -f pubspec.lock
          flutter pub get
      - name: Build iOS (no codesign)
        run: |
          set -uo pipefail
          flutter build ios --release --no-codesign || echo "::warning:: flutter build non-zero exit (known Team-check diagnosis), verifying artifacts"
          echo "===== DIAG build/ios tree ====="
          find build/ios -maxdepth 4 2>/dev/null | head -80 || true
          APP="$(find build/ios -name "Runner.app" -type d -print -quit 2>/dev/null || true)"
          OK=0
          if [ -n "$APP" ]; then
            BIN_NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null || echo Runner)"
            if [ -f "$APP/$BIN_NAME" ] && [ -d "$APP/Frameworks" ] && [ -d "$APP/flutter_assets" ]; then
              OK=1
            fi
          fi
          if [ "$OK" != "1" ]; then
            echo "::warning:: fallback: direct xcodebuild with signing disabled"
            xcodebuild \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/xcode-direct \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              EXPANDED_CODE_SIGN_IDENTITY="" \
              ENABLE_BITCODE=NO \
              build 2>&1 | tail -200 || true
            APP="$(find build/xcode-direct -name "Runner.app" -type d -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$APP" ]; then
            echo "::error:: Runner.app not found"
            exit 1
          fi
          echo "using app: $APP"
          printf '%s' "$APP" > .app_path
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(cat .app_path)"
          rm -rf Payload && mkdir Payload
          cp -r "$APP" Payload/
          codesign --force --deep --sign - Payload/Runner.app
          zip -qry OronBox-iOS-BLE-Full.ipa Payload
          ls -lh OronBox-iOS-BLE-Full.ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OronBox-iOS-BLE-Full-ipa
          path: OronBox-iOS-BLE-Full.ipa
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-ble-full-v1.3.0
          name: OronBox iOS Full BLE v1.3.0
          files: OronBox-iOS-BLE-Full.ipa
