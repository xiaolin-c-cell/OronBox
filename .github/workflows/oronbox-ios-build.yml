name: Build iOS IPA (TrollStore)
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  FLUTTER_VERSION: "3.47.5"
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter config & pub get
        run: |
          flutter config --no-analytics
          flutter --version
          flutter pub get
      # 静态分析先行：任何 Dart 编译错误在这里就以可读日志快速失败，
      # 不消耗后续构建时间，也不会被 flutter build 的输出吞掉。
      # 只让 error 失败——warning/info 是存量 lint 噪声，不阻塞构建
      # （flutter analyze 默认 fatal-warnings/fatal-infos 均为 true）。
      - name: Static analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      # flutter build 负责生成工程配置、pod install、编译 Dart AOT；
      # 其末尾的 Development Team 提示是 xcodebuild 失败后的兜底诊断
      # (flutter_tools mac.dart: _missingDevelopmentTeam)，非零退出属已知行为。
      # 策略: 容忍退出码 -> 诊断+强校验产物 -> 不完整则 xcodebuild 直编兜底。
      - name: Build iOS (no codesign)
        run: |
          set -uo pipefail
          flutter build ios --release --no-codesign || echo "::warning:: flutter build non-zero exit (known Team-check diagnosis), verifying artifacts next"
          echo "===== DIAG build/ios tree ====="
          find build/ios -maxdepth 3 2>/dev/null | head -60
          for d in build/ios build/ios/Release-iphoneos build/ios/Release-iphoneos/Runner.app; do
            echo "----- ls $d -----"
            ls -la "$d" 2>/dev/null || true
          done
          APP="$(find build/ios -name "Runner.app" -type d | head -n1 || true)"
          OK=0
          if [ -n "$APP" ]; then
            BIN_NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null || echo Runner)"
            echo "flutter app: $APP  CFBundleExecutable=$BIN_NAME"
            if [ -f "$APP/$BIN_NAME" ] && [ -d "$APP/Frameworks" ] && [ -d "$APP/flutter_assets" ]; then
              OK=1
            else
              echo "::warning:: flutter app incomplete (exe / Frameworks / flutter_assets check failed)"
            fi
          fi
          if [ "$OK" != "1" ]; then
            echo "::warning:: fallback: direct xcodebuild with signing fully disabled"
            xcodebuild \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/xcode-direct \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              EXPANDED_CODE_SIGN_IDENTITY="" \
              ENABLE_BITCODE=NO \
              build 2>&1 | tail -200
            APP="$(find build/xcode-direct -name "Runner.app" -type d | head -n1 || true)"
          fi
          if [ -z "$APP" ]; then
            echo "::error:: Runner.app not found anywhere - see DIAG output above"
            exit 1
          fi
          echo "::notice:: using app: $APP"
          printf '%s' "$APP" > .app_path
      - name: Ad-hoc sign & package IPA
        run: |
          set -euo pipefail
          APP="$(cat .app_path 2>/dev/null || true)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            APP="$(find build/ios build/xcode-direct -name "Runner.app" -type d 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$APP" ]; then
            echo "::error:: no Runner.app to package"
            exit 1
          fi
          echo "Packaging app: $APP"
          # --- Live Activity POC 诊断:检查 Widget Extension 是否被嵌入 ---
          echo "===== DIAG: embedded PlugIns ====="
          find "$APP/PlugIns" -maxdepth 2 2>/dev/null || echo "::warning:: no PlugIns dir in app (widget not embedded)"
          APPEX="$(find "$APP/PlugIns" -name '*.appex' -type d 2>/dev/null | head -n1 || true)"
          if [ -n "$APPEX" ]; then
            echo "::notice:: widget appex embedded at $APPEX"
          else
            echo "::warning:: widget appex MISSING - Live Activity will not work"
          fi
          rm -rf Payload && mkdir -p Payload
          cp -r "$APP" Payload/
          # 先逐个 ad-hoc 签嵌 dawn 的扩展(PlugIns/Watch 等)，再签主 app。
          # codesign 默认不递归签内部 bundle，必须显式处理，否则系统拒绝加载 appex。
          while IFS= read -r -d '' nested; do
            echo "ad-hoc signing nested bundle: $nested"
            codesign --force --sign - "$nested" 2>/dev/null || true
          done < <(find Payload/Runner.app/PlugIns Payload/Runner.app/Watch -maxdepth 1 -name '*.appex' -o -name '*.app' 2>/dev/null | tr '\n' '\0')
          codesign --force --deep --sign - Payload/Runner.app
          echo "===== DIAG: verify signatures ====="
          codesign --verify --deep --verbose=2 Payload/Runner.app 2>&1 | tail -20 || true
          zip -qry OronBox-iOS.ipa Payload
          ls -lh OronBox-iOS.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OronBox-iOS-ipa
          path: OronBox-iOS.ipa
          if-no-files-found: error
