name: Build OronBox Full BLE for iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter config & pub get
        run: |
          flutter config --no-analytics
          flutter --version
          flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || echo "::warning:: analyze reported issues, continuing to build"

      - name: Build iOS (no codesign)
        run: |
          set -uo pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build.log
          APP="$(find build/ios/iphoneos -name "Runner.app" -type d | head -n1 || true)"
          if [ -z "$APP" ]; then
            echo "::error:: Runner.app not found after flutter build; showing tail"
            tail -120 /tmp/flutter_build.log
            exit 1
          fi
          printf '%s' "$APP" > .app_path
          echo "APP=$APP"

      - name: Verify app bundle integrity
        run: |
          set -euo pipefail
          APP="$(cat .app_path)"
          BIN_NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null || echo Runner)"
          test -f "$APP/$BIN_NAME" || { echo "::error:: executable missing"; exit 1; }
          test -d "$APP/flutter_assets" || { echo "::error:: flutter_assets missing"; exit 1; }
          echo "Bundle OK: $BIN_NAME"

      - name: Ad-hoc sign & package IPA
        run: |
          set -euo pipefail
          APP="$(cat .app_path)"
          rm -rf Payload && mkdir -p Payload
          cp -r "$APP" Payload/
          codesign --force --deep --sign - Payload/Runner.app
          zip -qry OronBox-iOS-BLE-Full.ipa Payload
          ls -lh OronBox-iOS-BLE-Full.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OronBox-iOS-BLE-Full-ipa
          path: OronBox-iOS-BLE-Full.ipa
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-ble-full-v1.3.0
          name: "OronBox for iOS · Full BLE v1.3.0"
          body: |
            OronBox for iOS — 完整功能版（基于上游 v1.3.0 源码，整包移植 + 强制 BLE）

            - 五个 Tab 完整功能：探索 / 设备 / 队列 / 插件 / 设置
            - 强制 BLE GATT（iOS CoreBluetooth），彻底移除 SPP/RFCOMM
            - 小米 VelaOS（5E/5F）+ Amazfit ZeppOS 全协议栈：加密握手、L1 帧、SAR 分片、命令系统、健康数据
            - Ad-hoc 签名，可用 TrollStore/巨魔 或 爱思助手侧载安装
          files: OronBox-iOS-BLE-Full.ipa
          generate_release_notes: false
